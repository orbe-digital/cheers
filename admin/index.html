<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Painel · Cheers Empório</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-cheers-selo.svg">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ================= LOGIN ================= -->
<section class="login" id="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <img src="../assets/logo-cheers-completo.svg" alt="Cheers Empório" width="150" height="98">
    <h1>Painel do cardápio</h1>
    <label>Usuário<input name="user" autocomplete="username" required autocapitalize="none" spellcheck="false"></label>
    <label>Senha<input name="pass" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Entrar</button>
    <p class="msg" id="loginMsg" role="alert"></p>
  </form>
</section>

<!-- ================= PAINEL ================= -->
<div class="app" id="app" hidden>
  <header class="top">
    <img class="logo" src="../assets/logo-cheers-selo.svg" alt="" width="34" height="34">
    <div class="who"><b>Cardápio</b><small id="who"></small></div>
    <span class="status" id="status"></span>
    <a class="btn ghost" href="../" target="_blank" rel="noopener">Ver site</a>
    <button class="btn primary" id="publish" disabled>Publicar alterações</button>
    <button class="btn ghost" id="logout">Sair</button>
  </header>

  <div class="layout">
    <aside class="side">
      <label class="search"><input id="q" type="search" placeholder="Buscar produto…" autocomplete="off"></label>
      <nav id="catList" aria-label="Categorias"></nav>
      <button class="btn add" id="addCat">+ Nova categoria</button>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="admin.js"></script>
</body>
</html>
